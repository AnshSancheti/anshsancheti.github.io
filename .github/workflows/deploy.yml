name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Checkout Endless Autumn
        uses: actions/checkout@v4
        with:
          repository: AnshSancheti/nyc-tree-map
          ref: main
          path: endless-autumn-source

      - name: Install Endless Autumn dependencies
        working-directory: endless-autumn-source
        run: npm ci

      - name: Build Endless Autumn
        working-directory: endless-autumn-source
        run: npm run build

      - name: Add Endless Autumn to the site
        run: |
          mkdir -p build/endless-autumn
          cp -R endless-autumn-source/docs/. build/endless-autumn/

      - name: SPA fallback (optional)
        run: |
          cp build/index.html build/404.html || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
